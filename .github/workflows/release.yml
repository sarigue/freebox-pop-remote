name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libpulse0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' src/__init__.py | head -n1)"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME != version $VERSION" >&2
            exit 1
          fi
          echo "Version $VERSION validée."

  linux:
    name: Linux ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            patchelf \
            python3-venv \
            dpkg-dev \
            rpm \
            libgl1 \
            libegl1 \
            libpulse0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          pytest

      - name: Verify native runner architecture
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}:$(uname -m)" in
            x86_64:x86_64|arm64:aarch64|arm64:arm64) ;;
            *) echo "Runner non natif: $(uname -m), attendu ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

      - name: Build standalone Linux executable
        run: ./packaging/build-linux.sh

      - name: Build Debian package
        env:
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: ./packaging/build-deb.sh

      - name: Build RPM package
        env:
          RPM_ARCH: ${{ matrix.rpm_arch }}
        run: ./packaging/build-rpm.sh

      - name: Prepare Linux release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' src/__init__.py | head -n1)"
          mkdir -p release/linux
          cp dist/linux/freebox-pop-remote release/linux/freebox-pop-remote-${VERSION}-linux-${{ matrix.arch }}
          chmod +x release/linux/freebox-pop-remote-${VERSION}-linux-${{ matrix.arch }}
          cp dist/linux/*.deb release/linux/
          cp dist/linux/*.rpm release/linux/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: release/linux/*
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build Windows executable
        shell: pwsh
        run: ./packaging/build-windows.ps1

      - name: Prepare Windows release file
        shell: pwsh
        run: |
          $Version = (Select-String -Path "src\__init__.py" -Pattern '^__version__ = "([^"]+)"$').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path "release\windows" | Out-Null
          Copy-Item "dist\windows\freebox-pop-remote.exe" "release\windows\freebox-pop-remote-$Version-windows-x86_64.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64
          path: release/windows/*.exe
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS ${{ matrix.arch }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Build macOS application
        run: ./packaging/build-macos.sh

      - name: Archive app bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' src/__init__.py | head -n1)"
          mkdir -p release/macos
          OUT="release/macos/freebox-pop-remote-${VERSION}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/macos/Freebox Pop Remote.app" "$OUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: release/macos/*.zip
          if-no-files-found: error
          compression-level: 0

  assemble:
    name: Verify release assets
    needs:
      - linux
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          path: downloaded-assets

      - name: Gather and verify the nine platform assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' src/__init__.py | head -n1)"
          mkdir release-assets
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [ -e "release-assets/$name" ]; then
              echo "Collision de nom d'asset: $name" >&2
              exit 1
            fi
            cp "$asset" "release-assets/$name"
          done < <(find downloaded-assets -type f -print0)

          expected=(
            "freebox-pop-remote-${VERSION}-linux-x86_64"
            "freebox-pop-remote-${VERSION}-linux-amd64.deb"
            "freebox-pop-remote-${VERSION}-linux-x86_64.rpm"
            "freebox-pop-remote-${VERSION}-linux-arm64"
            "freebox-pop-remote-${VERSION}-linux-arm64.deb"
            "freebox-pop-remote-${VERSION}-linux-aarch64.rpm"
            "freebox-pop-remote-${VERSION}-windows-x86_64.exe"
            "freebox-pop-remote-${VERSION}-macos-x86_64.zip"
            "freebox-pop-remote-${VERSION}-macos-arm64.zip"
          )
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${#actual[@]}" -ne 9 ] || ! diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo "La liste des assets n'est pas celle attendue." >&2
            exit 1
          fi

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload verified release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download verified release assets
        uses: actions/download-artifact@v7
        with:
          name: release-assets
          path: release-assets

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' src/__init__.py | head -n1)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --verify-tag \
              --title "Freebox Pop Remote $VERSION" \
              --generate-notes
          fi
